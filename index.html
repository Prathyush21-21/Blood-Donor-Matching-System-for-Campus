<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Blood Match</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="./css/index.css?v=2">
    <link rel="stylesheet" href="./css/animations.css?v=2">
</head>
<body class="dark-theme">
    <div id="toast-container" class="toast-container"></div>
    
    <nav class="navbar glass">
        <div class="nav-content container">
            <a href="#" class="brand" onclick="app.navigate('home', event)">
                <i data-lucide="droplet" class="brand-icon"></i>
                <span class="brand-text">BloodMatch<span class="dot">.</span></span>
            </a>
            <div class="nav-links" id="nav-links">
                <!-- Injected via JS based on auth state -->
            </div>
            <button class="mobile-menu-btn" onclick="document.getElementById('nav-links').classList.toggle('active')">
                <i data-lucide="menu"></i>
            </button>
        </div>
    </nav>

    <main id="app" class="app-root main-transition">
        <!-- Content gets injected here -->
    </main>

    <!-- Scripts -->
    <script src="./js/store.js?v=3"></script>
    <script src="./js/app.js?v=3"></script>
    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
</body>
</html>
